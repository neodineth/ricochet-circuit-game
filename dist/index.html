<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ricochet Circuit</title>
<style>

nd:var(--mint);color:#302414;font-weight:800;grid-column:span 2}#event{min-height:3.8em;color:var(--dim);margin:0;padding:8px 16px;border-top:1px solid var(--line)}.power-description{margin:8px 0 2px;color:var(--dim);font-size:.875rem}#result{color:var(--mint)}@media(max-width:690px){.layout{grid-template-columns:1fr}.arenaHead,.clock{padding:8px 12px}aside{padding:12px}header{margin-bottom:14px}}

.power-meter progress[hidden]{display:none}

body:has(#playGate[open]){overflow:hidden}
html:has(body.arena-only),body.arena-only{overflow:hidden;overscroll-behavior:none}
body.arena-only{touch-action:none}
.arena-only header,.arena-only aside,.arena-only .arenaHead,.arena-only .clock,.arena-only #event{display:none}
.arena-only #battleArena{

.arena-controls{display:none}

.arena-controls button{min-height:44px;padding:7px 12px;background:#292318f5;border-color:#e5bd6d;color:#fff5dc;font-weight:700}
.arena-timer{margin-right:auto;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.arena-timer small{display:block;font-size:.65rem;line-height:1.15;font-weight:600}
#arenaBoost{color:var(--mint)}
.arena-only #fighters{
  grid-area:roster;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start;
  gap:5px;margin:0;min-width:0;
}
.arena-only .fighter[hidden]{display:none}

.arena-only .fighter>strong{font-size:.79rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena-only .fighter>small{display:none}
.arena-only .fighter>progress{height:4px;margin:3px 0 2px}
.arena-only .power-meter{grid-template-columns:minmax(0,1fr) auto;margin:0;gap:2px 4px;font-size:.7rem;line-height:1.1}
.arena-only .power-meter>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arena-only .power-meter progress{height:4px}
@media (orientation:landscape){

body.recording-frame{background:#080807}
.recording-frame #battleArena{

.recording-frame .arena-controls{gap:5px}
.recording-frame .arena-controls button{padding-inline:8px}
.recording-frame .fighter{padding:2px 5px 3px}
.recording-frame .fighter>strong,.recording-frame .power-meter{font-size:clamp(.625rem,2.6dvh,.72rem)}

#arenaResult{display:none}

#arenaResult button{min-height:44px}
#arenaContinue{background:var(--mint);color:#302414;font-weight:800}
.arena-only #battleArena[data-complete="true"]{

}
@media (orientation:landscape){
  .arena-only:not(.recording-frame) #battleArena[data-complete="true"]{
    grid-template:"ground controls" auto "ground roster" minmax(0,1fr) "result roster" auto / minmax(0,1fr) clamp(224px,39%,460px);
  }
}

#playGate{padding:0;border:0;border-radius:16px;background:transparent}
#playGate::backdrop{background:rgba(13,12,10,.88);backdrop-filter:blur(4px)}
#play{min-width:clamp(152px,40vw,220px);min-height:64px;padding:14px 32px;border:2px solid #ffe8a6;border-radius:16px;background:var(--mint);color:#302414;font-size:1.55rem;font-weight:800;box-shadow:0 8px 36px #0009}
#play:focus-visible{outline:3px solid #fff4d9;outline-offset:5px}

<main>
<header><h1>Ricochet Circuit</h1><p>Build your roster and watch the last fighter standing win.</p></header>
<div class="layout">
<section id="battleArena" aria-label="Battle arena" tabindex="-1">
<div class="frame"><div class="arenaHead"><strong id="state" role="status">Ready</strong><span id="arenaName">Ivory Ring</span></div>
<canvas id="field" width="720" height="600" aria-label="Animated arena showing bouncing fighters in a free-for-all"></canvas>
<div class="clock"><span id="time">0.0 s</span><span id="result" role="status"></span></div>
<p id="event" role="status">Last fighter standing wins.</p></div>
<div id="arenaResult" aria-labelledby="arenaResultTitle" hidden>
  <h2 id="arenaResultTitle" role="status"></h2>
  <button id="arenaContinue" type="button">Play Again</button>
  <button id="arenaSettings" type="button">Match Settings</button>
</div>
<div class="fighters" id="fighters"></div>
<div class="arena-controls" role="group" aria-label="Battle controls">
  <div class="arena-timer">
    <span id="arenaTime" aria-label="Match timer">0.0 s</span>
    <small id="arenaStage">Full arena</small>
    <small id="arenaMapName">Ivory Ring</small>
    <small id="arenaBoost" hidden>3× power damage</small>
  </div>
  <button id="arenaPause" type="button">Pause</button>
  <button id="arenaExit" type="button">Settings</button>
</div>
</section>
<aside aria-label="Match settings"><h2>Match setup</h2>
<label>Fighters<select id="count"><option value="2">2 fighters</option><option value="3">3 fighters</option><option value="4">4 fighters</option><option value="5" selected>5 fighters</option><option value="6">6 fighters</option><option value="7">7 fighters</option><option value="8">8 fighters</option></select></label>
<label class="toggle"><input type="checkbox" id="powerOne">Power 1 · Original</label>
<label class="toggle"><input type="checkbox" id="powerTwo" checked>Power 2 · Added later</label>
<form id="healthSetting" class="health-setting">
  <label>Starting HP<input type="number" id="startingHp" min="1" max="9999" step="1" inputmode="numeric" required value="150"></label>
  <button id="applyHealth">Apply to all</button>
</form>
<div id="loadouts"></div>
<label>Arena<select id="arena"></select></label>
<label class="toggle"><input type="checkbox" id="blood" checked>Blood effects</label>
<label>Render quality<select id="renderQuality"><option value="standard">Standard</option><option value="4k" selected>4K source</option></select></label>
<label class="toggle"><input type="checkbox" id="recordFrame" checked aria-describedby="recordFrameNote">9:16 recording card</label>
<p id="recordFrameNote" class="recording-note">Crop to the card edges when editing your screen recording.</p>
<label class="toggle"><input type="checkbox" id="musicOn" checked>Background music</label>
<label class="toggle"><input type="checkbox" id="effectsOn" checked>Attack sound effects</label>
<label>Playback speed<select id="speed"><option value="1">1× Normal</option><option value="0.5">0.5× Slow</option><option value="2">2× Fast</option></select></label>
<div class="controls"><button class="primary" id="start" aria-haspopup="dialog">Done</button><button id="pause" disabled>Pause</button><button id="reset">Reset</button></div>
</aside></div>
</main>
<dialog id="playGate" aria-label="Ready to play">
  <button id="play" type="button" autofocus>Play</button>
</dialog>
<script src="audio.js"></script>
<script src="arenas.js"></script>
<script>
'use strict';
const el = id => document.getElementById(id);

let startingHp = Number(el('startingHp').value);

const types = [

};
const THUNDER_DELAY = .5, THUNDER_RADIUS = 115;
const TORNADO_SPEED = 575, TORNADO_RADIUS = 20, TORNADO_CARRY = .28;

const PUDDLE_DURATION = 4;

const BOOMERANG_SPEED = 710;
const GRENADE_BOUNCE_TIME = .32;
const GRENADE_RADIUS = 100;

const HAMMER_JUMP_DURATION = .95;
const HAMMER_AIM_LOCK = .70;
const HAMMER_SLAM_RADIUS = 108;

  sentryBolts = [];

  for(const fighter of active){
    const dash=fighter.drillDash;
    if(!dash||fighter.hp<=damageTaken[fighter.slot]) continue;
    if(!dash.launched && dash.target.hp>damageTaken[dash.target.slot]){
      fighter.angle=Math.atan2(dash.target.y-fighter.y,dash.target.x-fighter.x);
    }
    if(elapsed<dash.launchAt) continue;
    if(!dash.launched){
      dash.launched=true;
      gameAudio.power(drillRush.name,'launch');
      fighter.vx=Math.cos(fighter.angle)*DRILL_DASH_SPEED;
      fighter.vy=Math.sin(fighter.angle)*DRILL_DASH_SPEED;
    }
    const nx=Math.cos(fighter.angle),ny=Math.sin(fighter.angle);
    const nextX=fighter.x+nx*DRILL_DASH_SPEED*dt;
    const nextY=fighter.y+ny*DRILL_DASH_SPEED*dt;
    fighter.x=nextX;
    fighter.y=nextY;
    constrain(fighter,inset);
    const blocked=fighter.x!==nextX||fighter.y!==nextY;

    let target, contact, nearest=Infinity;
    for(const rival of active){
      if(rival===fighter||rival.hammerJump||rival.hp<=damageTaken[rival.slot]) continue;
      const distance=(rival.x-fighter.x)**2+(rival.y-fighter.y)**2;
      if(distance>=nearest || (rival.x-fighter.x)*nx+(rival.y-fighter.y)*ny<0) continue;
      const point=weaponContact(fighter,rival,DRILL_POWER_SCALE);
      if(point){nearest=distance;target=rival;contact=point;}
    }
    if(!target&&!blocked&&elapsed<dash.endAt) continue;

    if(target){
      const damage=dealPowerDamage(target,30,damageTaken);
      damageLabel(contact,damage,drillRush.color,true);
      gameAudio.power(drillRush.name,'impact');
      addPowerEffect(drillRush.name,...contact,drillRush.color,fighter.angle);
      el('event').textContent=`${fighter.slot+1} · ${fighter.name} lands Drill Rush!`;
      powerNoticeUntil=elapsed+1.75;
    }
    fighter.vx*=.26;
    fighter.vy*=.26;
    fighter.drillDash=null;
    fighter.wait=Math.max(fighter.wait,.25);
    advancePower(fighter);
  }
}
function updateProjectiles(active, damageTaken, dt, inset) {
  projectiles=projectiles.filter(shot=>{
    const isBoomerang=shot.kind==='Boomerang';
    const power=secondaryPowers[shot.owner.weapon.name];
    const previousX=shot.x, previousY=shot.y;
    let caught=false;
    if(shot.returning){
      const dx=shot.owner.x-shot.x,dy=shot.owner.y-shot.y;
      const distance=Math.hypot(dx,dy);
      caught=distance<=BOOMERANG_SPEED*dt;
      shot.x+=caught?dx:dx/distance*BOOMERANG_SPEED*dt;
      shot.y+=caught?dy:dy/distance*BOOMERANG_SPEED*dt;
    } else {
      const edge=inset+(isBoomerang?10:8);
      let x=shot.x+shot.vx*dt,y=shot.y+shot.vy*dt;
      // Trim the outbound segment to its first wall contact.
      if(isBoomerang){
        const ratios=[1];
        if(x<edge||x>W-edge) ratios.push(((x<edge?edge:W-edge)-shot.x)/(x-shot.x));
        if(y<edge||y>H-edge) ratios.push(((y<edge?edge:H-edge)-shot.y)/(y-shot.y));
        const fraction=Math.max(0,Math.min(...ratios));
        x=shot.x+(x-shot.x)*fraction;
        y=shot.y+(y-shot.y)*fraction;
        shot.turnAtWall=ratios.length>1;
      } else {
        if(x<edge||x>W-edge) shot.vx*=-1;
        if(y<edge||y>H-edge) shot.vy*=-1;
      }
      shot.x=Math.max(edge,Math.min(W-edge,x));
      shot.y=Math.max(edge,Math.min(H-edge,y));
    }

    if(isBoomerang){
      const dx=shot.x-previousX,dy=shot.y-previousY;
      const lengthSquared=dx*dx+dy*dy||1;
      for(const rival of active){
        if(rival===shot.owner||rival.hammerJump||shot.hits.has(rival.slot)||rival.hp<=damageTaken[rival.slot]) continue;
        const t=Math.max(0,Math.min(1,((rival.x-previousX)*dx+(rival.y-previousY)*dy)/lengthSquared));
        if(Math.hypot(rival.x-previousX-dx*t,rival.y-previousY-dy*t)>R+12) continue;
        shot.hits.add(rival.slot);
        damageLabel([rival.x,rival.y],dealPowerDamage(rival,14,damageTaken),power.color,true);
        addPowerEffect(shot.kind,rival.x,rival.y,power.color);
      }
      if(shot.turnAtWall){
        shot.returning=true;
        shot.turnAtWall=false;
        shot.hits.clear();
        gameAudio.power(shot.kind,'return');
        addPowerEffect(shot.kind,shot.x,shot.y,power.color);
      }
      return !caught;
    }

    shot.age+=dt;
    if(shot.age<(shot.bounces+1)*GRENADE_BOUNCE_TIME) return true;
    shot.bounces++;
    gameAudio.power(shot.kind,shot.bounces===2?'impact':'bounce');
    addPowerEffect(shot.bounces===2?shot.kind:'Grenade Bounce',shot.x,shot.y,power.color);
    if(shot.bounces===1) return true;
    for(const rival of active){
      if(rival===shot.owner||rival.hammerJump) continue;
      const distance=Math.hypot(rival.x-shot.x,rival.y-shot.y);
      if(distance>GRENADE_RADIUS) continue;
      damageLabel([rival.x,rival.y],dealPowerDamage(rival,distance<=46?24:12,damageTaken),power.color,true);
    }
    return false;
  });
}
function advanceTravelingPower(power, distance, inset) {
  const dx=Math.cos(power.angle)*distance,dy=Math.sin(power.angle)*distance;
  const x=power.x,y=power.y;
  const clamp=(value,limit)=>Math.max(inset,Math.min(limit-inset,value));
  power.x=clamp(x+dx,W);
  power.y=clamp(y+dy,H);
  return power.x!==x+dx||power.y!==y+dy;
}

function updateTravelingPowers(active,damageTaken,dt,inset) {
  const canHit=(target,owner)=>target!==owner&&!target.hammerJump&&target.hp>damageTaken[target.slot];
  travelingPowers=travelingPowers.filter(power=>{
    const {name,color,owner,target}=power;
    const hit=(rival,damage)=>damageLabel([rival.x,rival.y],dealPowerDamage(rival,damage,damageTaken),color,true);
    if(name==='Thunder Circle'){
      if(elapsed+MATCH_CLOCK_EPSILON<power.strikeAt) return true;
      gameAudio.power(name,'impact');
      addPowerEffect(name,power.x,power.y,color);
      for(const rival of active){
        if(canHit(rival,owner)&&Math.hypot(rival.x-power.x,rival.y-power.y)<=THUNDER_RADIUS) hit(rival,14);
      }
      return false;
    }

    if(name==='Whirlwind'){
      if(elapsed>=power.expires||target.hp<=damageTaken[target.slot]) return false;
      if(power.releaseAt){
        if(target.hammerJump||target.drillDash){
          hit(target,18);
          return false;
        }
        advanceTravelingPower(power,210*dt,inset+R);
        target.x=power.x;
        target.y=power.y;
        if(elapsed<power.releaseAt) return true;
        hit(target,18);
        return false;
      }
      const dx=target.x-power.x,dy=target.y-power.y;
      const distance=Math.hypot(dx,dy);
      power.angle=Math.atan2(dy,dx);
      advanceTravelingPower(power,Math.min(distance,TORNADO_SPEED*dt),inset+TORNADO_RADIUS);
      if(canHit(target,owner)&&!target.drillDash&&Math.hypot(target.x-power.x,target.y-power.y)<=R+TORNADO_RADIUS){
        power.releaseAt=elapsed+TORNADO_CARRY;
        power.expires=Math.max(power.expires,power.releaseAt+.05);
        gameAudio.power(name,'grab');
      }
      return true;
    }

    if(elapsed<power.launchAt) return true;
    if(power.x===undefined){
      owner.flameSwing=null;
      if(owner.hp<=damageTaken[owner.slot]) return false;
      owner.angle=power.angle;
      power.x=owner.x;
      power.y=owner.y;
      gameAudio.power(name,'launch');
    }
    const fromX=power.x,fromY=power.y;
    const atWall=advanceTravelingPower(power,FLAME_SPEED*dt,inset);
    const dx=power.x-fromX,dy=power.y-fromY,lengthSquared=dx*dx+dy*dy||1;
    for(const rival of active){
      if(!canHit(rival,owner)||power.hits.has(rival.slot)) continue;
      const t=Math.max(0,Math.min(1,((rival.x-fromX)*dx+(rival.y-fromY)*dy)/lengthSquared));
      if(Math.hypot(rival.x-fromX-t*dx,rival.y-fromY-t*dy)>FLAME_RADIUS+R) continue;
      power.hits.add(rival.slot);
      hit(rival,12);
    }
    return !atWall;
  });
}

function updateDevices(active, damageTaken, dt, inset) {
  devices=devices.filter(device=>device.expires>elapsed);
  for(const device of devices){
    if(elapsed<device.landAt) continue;
    if(!device.armed){
      device.armed=true;
      gameAudio.power(device.name,'land');
      addPowerEffect(device.name,device.x,device.y,device.color);
      continue;
    }

    if(device.name==='Chemical Bomb'){
      for(const fighter of active){
        if(fighter.hammerJump||fighter.hp<=damageTaken[fighter.slot]) continue;
        if(Math.hypot(fighter.x-device.x,fighter.y-device.y)>PUDDLE_RADIUS+R) continue;
        if(elapsed<(device.hitAt.get(fighter.slot)??0)) continue;
        device.hitAt.set(fighter.slot,elapsed+.48);
        damageLabel([fighter.x,fighter.y],dealPowerDamage(fighter,5,damageTaken),device.color,true);
      }
      continue;
    }

    let target, closest=Infinity;
    for(const fighter of active){
      if(fighter===device.owner||fighter.hammerJump||fighter.hp<=damageTaken[fighter.slot]) continue;
      const distance=Math.hypot(fighter.x-device.x,fighter.y-device.y);
      if(distance<closest){closest=distance;target=fighter;}
    }
    if(!target) continue;
    const aimLead=Math.min(.24,closest/820);
    device.angle=Math.atan2(target.y+target.vy*aimLead-device.y,target.x+target.vx*aimLead-device.x);
    if(elapsed<device.nextShot) continue;
    device.nextShot=elapsed+SENTRY_SHOT_INTERVAL;
    const nx=Math.cos(device.angle),ny=Math.sin(device.angle);
    gameAudio.power(device.name,'fire');
    sentryBolts.push({owner:device.owner,x:device.x+nx*18,y:device.y+ny*18,
      vx:nx*820,vy:ny*820,expires:elapsed+.95,color:device.color});
  }

  sentryBolts=sentryBolts.filter(bolt=>{
    bolt.x+=bolt.vx*dt;
    bolt.y+=bolt.vy*dt;
    if(bolt.expires<=elapsed||bolt.x<inset||bolt.x>W-inset||bolt.y<inset||bolt.y>H-inset) return false;
    for(const fighter of active){
      if(fighter===bolt.owner||fighter.hammerJump||fighter.hp<=damageTaken[fighter.slot]) continue;
      if(Math.hypot(fighter.x-bolt.x,fighter.y-bolt.y)>R+5) continue;
      damageLabel([fighter.x,fighter.y],dealPowerDamage(fighter,SENTRY_SHOT_DAMAGE,damageTaken),bolt.color,true);
      return false;
    }
    return true;
  });
}
function animateHitParticles(dt) {
  impacts=impacts.filter(p=>p.life>dt);
  for(const p of impacts) p.life-=dt;
  sparks=sparks.filter(p=>p.life>0);
  for(const p of sparks) {p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  bloodDrops=bloodDrops.filter(p=>p.life>dt);
  for(const p of bloodDrops){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
}
function step(dt) {
  elapsed+=dt;
  const inset=wallInset();
  const active=fighters.filter(f=>f.hp>0);
  const grounded=active.filter(f=>!f.hammerJump&&!f.drillDash);
  for(const prop of obstacles) prop.flash=Math.max(0,prop.flash-dt);
  for(const f of active) {
    const speed=Math.hypot(f.vx,f.vy);
    if(!f.drillDash&&speed>370){f.vx*=370/speed;f.vy*=370/speed;}
    f.flash=Math.max(0,f.flash-dt);
    if(f.power) f.charge=Math.min(100,f.charge+PASSIVE_CHARGE*dt);
    if(!f.hammerJump&&!f.drillDash) move(f,dt,inset);
  }
  for(let pass=0;pass<4;pass++){
    for(let i=0;i<grounded.length;i++){
      for(let j=i+1;j<grounded.length;j++) separate(grounded[i],grounded[j]);
    }
    for(const f of grounded) constrain(f,inset);
  }
  if(Math.floor(elapsed*45)!==Math.floor((elapsed-dt)*45)) {
    for(const f of grounded) {
      if(sawOverdrive(f)) continue;
      f.trail.push([f.x,f.y,f.angle,f.weapon.reach]);
      if(f.trail.length>5) f.trail.shift();
    }
  }
  animateHitParticles(dt);
  powerEffects=powerEffects.filter(effect=>elapsed-effect.start<POWER_EFFECT_DURATION);
  const damageTaken=fighters.map(()=>0), healing=fighters.map(()=>0);
  resolveHammerJumps(active,damageTaken,inset);
  resolveDrillDashes(active,damageTaken,dt,inset);
  updateProjectiles(active,damageTaken,dt,inset);
  updateDevices(active,damageTaken,dt,inset);
  updateTravelingPowers(active,damageTaken,dt,inset);
  activateChargedPowers(active,damageTaken,healing);
  if (!holdingGrid()) {
    updateFollowUps(damageTaken);
    resolveNormalHits(active, damageTaken, healing);
    activateChargedPowers(active,damageTaken,healing);
  }
  settleStep(active, damageTaken, healing);
}
function resolveNormalHits(active, damageTaken, healing) {
  const normalHits=[];
  for(const attacker of active){
    if(attacker.hammerJump||attacker.drillDash||attacker.wait>0||elapsed<attacker.jammedUntil||attacker.hp<=damageTaken[attacker.slot]) continue;
    let nearest=Infinity,target,contact;
    for(const candidate of active){
      if(candidate===attacker||candidate.hammerJump||candidate.hp<=damageTaken[candidate.slot]) continue;
      const d=(candidate.x-attacker.x)**2+(candidate.y-attacker.y)**2;
      if(d>=nearest) continue;
      const point=weaponContact(attacker,candidate);
      if(point){nearest=d;target=candidate;contact=point;}
    }
    if(!target) continue;
    normalHits.push({attacker,target,contact});
  }
  const hitFighters=new Set(normalHits.map(hit=>hit.target));
  for(const f of hitFighters) breakCombo(f);
  for(const {attacker:a,target:b,contact} of normalHits){
    strike(a,b,contact);
    let amount=a.weapon.damage*(a.name==='Surge'&&a.hits%3===0?2:1);
    if(b.name==='Bastion') amount*=.72;
    if(elapsed<b.sunderUntil&&b.sunderHits>0){
      amount*=1.25;
      b.sunderHits--;
      addPowerEffect('Sunder',b.x,b.y,powers['Iron Mace'].color);
    }
    const damage=dealDamage(b,amount,damageTaken);
    damageLabel(contact,damage,a.color);
    if(!hitFighters.has(a)) chargeFromHit(a);
    const sawRepair=a.weapon.kind==='saw'?(elapsed<a.repairUntil?.75:.25):0;
    healing[a.slot]+=damage*((a.name==='Vortex'?.4:0)+sawRepair);
    if(sawRepair===.75&&damage>0) addPowerEffect('Redline Repair',a.x,a.y,powers['Ember Saw'].color,0,contact);
    if(elapsed>=powerNoticeUntil){
      el('event').textContent=`${a.slot+1} · ${a.name} hit ${b.slot+1} · ${b.name} for ${Math.round(damage)}.`;
    }
  }
}
function settleStep(active, damageTaken, healing) {
  for(const f of active){
    f.hp=Math.max(0,f.hp-damageTaken[f.slot]);
    if(f.hp>0) f.hp=Math.min(startingHp,f.hp+healing[f.slot]);
  }
  const survivors=active.filter(f=>f.hp>0);
  if(survivors.length<=1){
    mode='done';
    completedArena=el('arena').selectedIndex;
    [matchWinner]=survivors;
    const result=matchWinner?`${matchWinner.slot+1} · ${matchWinner.name} wins`:'Simultaneous knockout';
    el('result').textContent=result;
    el('arenaResultTitle').textContent=result;
    timeStop=null;
    projectiles=[];
    devices=[];
    sentryBolts=[];
    powerEffects=[];
    followUps=[];
    travelingPowers=[];
    if(matchWinner){
      retireWinningWeapon(matchWinner.weapon.name);
      matchWinner.flameSwing=null;
      matchWinner.hammerJump=null;
      matchWinner.drillDash=null;
      matchWinner.overdriveUntil=0;
      matchWinner.trail.length=0;
      if(Math.hypot(matchWinner.vx,matchWinner.vy)<80){
        matchWinner.vx=Math.cos(matchWinner.angle)*240;
        matchWinner.vy=Math.sin(matchWinner.angle)*240;
      }
      constrain(matchWinner,wallInset());
    }
    updateControls();
  }
}
function retireWinningWeapon(name) {
  const winnerIndex=weapons.findIndex(weapon=>weapon.name===name);
  retiredWeapons.add(winnerIndex);
  if(retiredWeapons.size===weapons.length) retiredWeapons.clear();
  const eligible=weapons.map((_,index)=>index).filter(index=>index!==winnerIndex&&!retiredWeapons.has(index));
  for(const {weapon} of roster){
    for(const option of weapon.options) option.disabled=retiredWeapons.has(Number(option.value));
    const selected=Number(weapon.value);
    if(selected===winnerIndex||retiredWeapons.has(selected)){
      weapon.value=String(eligible[Math.floor(Math.random()*eligible.length)]);
    }
  }
}
function circle(x,y,r) {
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
}
function drawWeapon(f) {
  const {kind}=f.weapon;
  const reach=f.weapon.reach;
  const time=mode==='ready'?previewTime:elapsed+victoryTime;
  const motionTime=reducedMotion.matches?0:time;
  if(kind==='drill'||kind==='saw'){
    drawMotorWeapon(f,reach,motionTime);
    return;
  }
  ctx.save();
  ctx.translate(f.x,f.y);
  if(f.flameSwing){
    const {angle,launchAt}=f.flameSwing;
    const sweep=Math.max(0,Math.min(1,1-(launchAt-elapsed)/FLAME_WINDUP));
    ctx.rotate(angle-1.5*(1-sweep));
    ctx.strokeStyle='#ff9b43';
    ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(0,0,reach,.25,1.35);ctx.stroke();
  } else ctx.rotate(f.angle);
  ctx.strokeStyle=f.color;
  ctx.fillStyle=f.weapon.tint??'#16233b';
  ctx.strokeStyle=f.weapon.tint?'#293044':f.color;
  ctx.lineWidth=3;
  traceOutline(bladeOutline(f));
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}
function drawMotorWeapon(f,reach,time) {
  ctx.save();
  ctx.translate(f.x,f.y);
  ctx.rotate(f.angle);
  ctx.lineJoin='round';
  ctx.lineWidth=4;
  ctx.strokeStyle='#101728';
  ctx.fillStyle='#788597';
  ctx.fillRect(22,-8,20,16);
  if(f.weapon.kind==='drill'){
    const dash=f.drillDash;
    const scale=dash?(reducedMotion.matches?DRILL_POWER_SCALE:
      1+(DRILL_POWER_SCALE-1)*Math.min(1,1-(dash.launchAt-elapsed)/DRILL_WINDUP)):1;
    const base=22+14*scale, tip=22+(reach-22)*scale, halfHeight=18*scale;
    const steel=ctx.createLinearGradient(0,-halfHeight,0,halfHeight);
    steel.addColorStop(0,dash?'#d6fff8':'#f8fcff');
    steel.addColorStop(.43,dash?'#4bdcda':'#97b1c6');
    steel.addColorStop(1,'#364e6a');
    if(dash?.launched&&!reducedMotion.matches){
      ctx.strokeStyle='#08a2b68c';ctx.lineWidth=5;
      for(const y of [-24,0,24]){
        ctx.beginPath();ctx.moveTo(-92,y);ctx.lineTo(18,y);ctx.stroke();
      }
      ctx.strokeStyle='#07435a';ctx.lineWidth=4;
    }
    traceOutline(bladeOutline(f,scale));
    ctx.fillStyle=steel;ctx.fill();ctx.stroke();
    ctx.save();ctx.clip();
    ctx.strokeStyle='#354865';ctx.lineWidth=4;
    const pitch=15*scale, scroll=dash?760:155;
    for(let x=base-20*scale+(time*scroll)%pitch;x<tip+20*scale;x+=pitch){
      ctx.beginPath();ctx.moveTo(x-10*scale,halfHeight);ctx.lineTo(x+11*scale,-halfHeight);ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle=f.color;ctx.fillRect(28,-13,7,26);
  } else {
    const left=39,right=reach-13,r=10,straight=right-left,loop=2*straight+TAU*r;
    ctx.beginPath();
    ctx.moveTo(left,-r);ctx.lineTo(right,-r);
    ctx.arc(right,0,r,-Math.PI/2,Math.PI/2);
    ctx.lineTo(left,r);ctx.arc(left,0,r,Math.PI/2,3*Math.PI/2);
    ctx.closePath();
    const overdrive=sawOverdrive(f);
    ctx.fillStyle=overdrive?'#a93c20':'#46566d';ctx.fill();ctx.stroke();
    const teeth=Math.round(loop/7);
    ctx.fillStyle=overdrive?'#fff0ad':'#deeaff';
    for(let i=0;i<teeth;i++){
      let d=(i*loop/teeth+time*(overdrive?690:220))%loop;
      let x,y,angle;
      if(d<straight){x=left+d;y=-r;angle=-Math.PI/2;}
      else if((d-=straight)<Math.PI*r){angle=d/r-Math.PI/2;x=right+r*Math.cos(angle);y=r*Math.sin(angle);}
      else if((d-=Math.PI*r)<straight){x=right-d;y=r;angle=Math.PI/2;}
      else {angle=(d-straight)/r+Math.PI/2;x=left+r*Math.cos(angle);y=r*Math.sin(angle);}
      ctx.save();ctx.translate(x,y);ctx.rotate(angle);
      ctx.beginPath();ctx.moveTo(-1,-3);ctx.lineTo(5,0);ctx.lineTo(-1,3);
      ctx.closePath();ctx.fill();ctx.restore();
    }
    ctx.fillStyle=f.color;
    circle(left,0,6);ctx.fill();
    circle(right,0,4);ctx.fill();
  }
  ctx.restore();
}
function drawSkin(f) {
  ctx.save();
  circle(f.x,f.y,R-2);
  ctx.clip();
  ctx.globalAlpha=.36;
  ctx.strokeStyle=f.color;
  ctx.fillStyle=f.color;
  if(f.skin.pattern==='stripes'){
    ctx.lineWidth=3;
    for(const offset of [-30,-20,20,30]){
      ctx.beginPath();ctx.moveTo(f.x+offset-20,f.y+25);
      ctx.lineTo(f.x+offset+20,f.y-25);ctx.stroke();
    }
  } else if(f.skin.pattern==='ring'){
    ctx.lineWidth=3;circle(f.x,f.y,R-7);ctx.stroke();
  } else if(f.skin.pattern==='dots'){
    for(let i=0;i<8;i++){
      const angle=i*Math.PI/4;
      circle(f.x+20*Math.cos(angle),f.y+20*Math.sin(angle),2);ctx.fill();
    }
  }
  ctx.restore();

const grassTufts=Array.from({length:165},(_,i)=>[

function drawArenaBackdrop(arena,field) {

function drawCollapse(arena) {
  const inset=wallInset();
  if(!inset) return;
  const [,,trim,border]=arena.colors;
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);
  ctx.rect(inset,inset,W-inset*2,H-inset*2);
  ctx.clip('evenodd');
  ctx.fillStyle=border;
  ctx.globalAlpha=.82;
  ctx.fillRect(0,0,W,H);
  const stageStart=collapseStage()*COLLAPSE_INTERVAL;
  const progress=reducedMotion.matches?1:Math.min(1,Math.max(0,(elapsed-stageStart)/.72));
  ctx.globalAlpha=.72*(1-progress);
  ctx.strokeStyle=ctx.fillStyle=trim;
  for(let edge=0;edge<4;edge++){
    ctx.save();
    ctx.translate(W/2,H/2);
    ctx.rotate(edge*TAU/4);
    const length=edge%2?H:W;
    const boundary=(edge%2?W:H)/2-inset;
    for(let i=0;i<9;i++){
      const x=(i-4)*(length-2*inset)/9;
      const distance=3+progress*(11+i%3*12);
      ctx.save();
      ctx.translate(x,-boundary-distance);
      drawCollapseFragment(arena.collapse,i,progress);
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle=border;ctx.lineWidth=9;
  ctx.strokeRect(inset,inset,W-inset*2,H-inset*2);
  ctx.strokeStyle=trim;ctx.lineWidth=3;
  ctx.strokeRect(inset,inset,W-inset*2,H-inset*2);
}

function drawCollapseFragment(material,index,progress) {

  } else if(material==='pixel'){
    ctx.fillRect(-8,-6,13,12);

  } else {
    ctx.rotate(progress*(index%2?1:-1));

      if(material==='ice') ctx.stroke();

}

    ctx.save();

      ctx.globalAlpha=Math.min(1,(device.expires-elapsed)/.45);

function drawTravelingPowers() {
  const inset=wallInset();
  ctx.save();
  ctx.beginPath();ctx.rect(inset,inset,W-2*inset,H-2*inset);ctx.clip();
  for(const power of travelingPowers){
    if(power.x===undefined) continue;
    ctx.save();ctx.translate(power.x,power.y);
    const time=reducedMotion.matches?0:elapsed;
    if(power.name==='Thunder Circle'){
      const progress=Math.max(0,Math.min(1,1-(power.strikeAt-elapsed)/THUNDER_DELAY));

      circle(0,0,THUNDER_RADIUS*progress);

    } else if(power.name==='Whirlwind'){
      const scale=power.releaseAt?1.25:1;
      ctx.scale(scale,scale);
      for(let i=0;i<7;i++){
        const y=22-i*9,radius=9+i*3.7,phase=time*21+i*.8;
        ctx.beginPath();ctx.ellipse(0,y,radius,5+i*.35,0,phase,phase+Math.PI*1.65);

        ctx.lineWidth=3;ctx.stroke();
        circle(Math.cos(phase)*radius,y+Math.sin(phase)*5,2);
        ctx.fillStyle='#eaffff';ctx.fill();

      for(let i=-3;i<=3;i++){

        const tail=-30-14*flicker-i*i*1.5;

        heat.addColorStop(0,'#ba291000');heat.addColorStop(.27,'#f04412');
        heat.addColorStop(.64,'#ff9a17');heat.addColorStop(1,'#fff1a5');
        ctx.beginPath();ctx.moveTo(tail,y-9+6*flicker);
        ctx.bezierCurveTo(-14,y-15,front-11,y-13,front,y);
        ctx.bezierCurveTo(front-1,y+8,-9,y+12,tail,y-9+6*flicker);

  }

  circle(f.x,f.y-R,10);ctx.fillStyle=f.color;ctx.fill();
  ctx.fillStyle='#1d1c20';ctx.font='bold 13px system-ui';
  ctx.fillText(f.slot+1,f.x,f.y-R);
}

function drawHammerJump(fighter) {
  const jump=fighter.hammerJump;
  const progress=Math.min(1,(elapsed-jump.start)/HAMMER_JUMP_DURATION);
  const landing=hammerLanding(jump,wallInset());
  const x=jump.startX+(landing.x-jump.startX)*progress;
  const groundY=jump.startY+(landing.y-jump.startY)*progress;
  const motion=!reducedMotion.matches;
  const lift=motion?Math.min(82,Math.max(0,groundY-55))*Math.sin(Math.PI*progress):0;
  const swing=Math.max(0,(progress-.54)/.46);
  const raisedAngle=-.25-1.94*Math.min(1,progress/.44);
  const angle=motion?raisedAngle+(2.56*swing*swing):-.85;
  const facing=jump.direction;

  ctx.save();
  ctx.translate(jump.x,jump.y);
  ctx.fillStyle='#a6442433';
  ctx.beginPath();ctx.ellipse(0,0,52,34,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#a64424';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.stroke();
  ctx.restore();

  ctx.save();
  circle(x,groundY+5,R*(1-.25*Math.sin(Math.PI*progress)));
  ctx.fillStyle='#241e295e';ctx.fill();
  ctx.translate(x,groundY-lift);
  ctx.scale(facing,1);
  if(motion&&swing>.18){
    ctx.strokeStyle='#f5994099';ctx.lineWidth=17;
    ctx.beginPath();ctx.arc(0,0,92,angle-.57,angle);ctx.stroke();
    ctx.strokeStyle='#ffe5a4';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,108,angle-.45,angle+.06);ctx.stroke();
  }
  ctx.rotate(angle);
  ctx.fillStyle='#3e2630';ctx.strokeStyle='#f3ad60';ctx.lineWidth=4;
  ctx.fillRect(20,-8,73,16);ctx.strokeRect(20,-8,73,16);
  ctx.fillStyle='#281f2b';ctx.fillRect(71,-43,49,86);
  ctx.strokeStyle='#ffe0a2';ctx.lineWidth=5;ctx.strokeRect(71,-43,49,86);
  ctx.fillStyle='#d3692c';
  ctx.fillRect(81,-40,29,11);ctx.fillRect(81,29,29,11);
  ctx.fillStyle='#ffce79';ctx.fillRect(88,-13,15,26);
  ctx.restore();

  ctx.save();
  ctx.translate(x-fighter.x,groundY-lift-fighter.y);
  drawFighter(fighter);
  ctx.restore();
}
function draw() {
  const field=el('field');
  ctx.setTransform(field.width/W,0,0,field.height/H,0,0);
  ctx.save();
  const arena=arenas[arenaSelect.selectedIndex];
  drawArenaBackdrop(arena,field);
  drawObstacles(arena);
  drawCollapse(arena);
  ctx.restore();
  drawDevices();
  drawTravelingPowers();
  for(const f of fighters){
    if(f.hp===0||f.hammerJump) continue;
    ctx.fillStyle=f.color;
    if(!reducedMotion.matches) f.trail.forEach(([x,y,angle,reach],i)=>{
      ctx.globalAlpha=(i+1)*.021;circle(x,y,8+i*1.3);ctx.fill();
      ctx.strokeStyle=f.color;ctx.lineWidth=3+i*.45;
      ctx.beginPath();ctx.moveTo(x+Math.cos(angle)*R,y+Math.sin(angle)*R);
      ctx.lineTo(x+Math.cos(angle)*reach,y+Math.sin(angle)*reach);ctx.stroke();
    });
    ctx.globalAlpha=1;
    circle(f.x+3,f.y+5,R+1);ctx.fillStyle='#241e2948';ctx.fill();
    drawFighter(f);
  }
  for(const p of sparks){
    ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle=p.color;
    ctx.strokeStyle=p.color;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke();
  }
  if(el('blood').checked){
    ctx.fillStyle='#b21e35';
    for(const drop of bloodDrops){
      ctx.globalAlpha=Math.min(.9,drop.life/.22);
      circle(drop.x,drop.y,drop.r);ctx.fill();
    }
  }
  for(const impact of impacts){
    if (holdingGrid() && impact.special) continue;
    const progress=1-impact.life/.38;
    ctx.globalAlpha=1-progress;
    if(!reducedMotion.matches){
      ctx.strokeStyle=impact.color;ctx.lineWidth=2;
      circle(impact.x,impact.y,8+progress*44);ctx.stroke();
    }
    ctx.strokeStyle='#35282f';ctx.lineWidth=3;ctx.fillStyle=impact.special?'#ffdc87':'#fff3d8';ctx.font=impact.special?'bold 25px system-ui':'bold 21px system-ui';ctx.textAlign='center';
    ctx.strokeText('−'+Math.round(impact.damage),impact.x,impact.y-22-progress*28);
    ctx.fillText('−'+Math.round(impact.damage),impact.x,impact.y-22-progress*28);
  }
  ctx.globalAlpha=1;
  if (!holdingGrid()) drawPowerEffects();
  drawProjectiles();
  for(const f of fighters){
    if(f.hp>0&&f.hammerJump) drawHammerJump(f);
  }
}
function holdingGrid() {
  return timeStop !== null && timeStop.age < GRID_RELEASE;
}

function traceGrid(cut, pull, split) {
  const spacing = 54;
  function point(x, y) {
    const dx = cut.x - x, dy = cut.y - y;
    const distance = Math.hypot(dx, dy);
    const strain = pull * .75 * Math.exp(-distance / 210);
    const rupture = split * 12 * Math.sign(x - cut.x);
    return [x + dx * strain + rupture, y + dy * strain];
  }
  ctx.beginPath();
  for (let x = -spacing; x <= W + spacing; x += spacing) {
    ctx.moveTo(...point(x, -spacing));
    for (let y = -spacing + 18; y <= H + spacing; y += 18) ctx.lineTo(...point(x, y));
  }
  for (let y = -spacing; y <= H + spacing; y += spacing) {
    ctx.moveTo(...point(-spacing, y));
    for (let x = -spacing + 18; x <= W + spacing; x += 18) ctx.lineTo(...point(x, y));
  }
  ctx.stroke();
}

function drawGridCut(cut) {
  const stopped = cut.age >= GRID_BUILDUP && cut.age < GRID_RELEASE;
  const aftermath = Math.max(0, (cut.age - GRID_RELEASE) / GRID_AFTERMATH);
  const buildup = Math.min(1, cut.age / GRID_BUILDUP);
  const motion = !reducedMotion.matches;
  const pull = motion ? buildup * (1 - aftermath) : 1;
  ctx.globalAlpha = 1 - aftermath;
  ctx.fillStyle = stopped ? '#110e1b9c' : '#1a122e72';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#f9cf76';
  ctx.lineWidth = stopped ? 2.4 : 1.2;
  ctx.globalAlpha = (1 - aftermath) * (stopped ? .76 : .48);
  traceGrid(cut, pull, stopped ? 1.6 : aftermath * 2);
  ctx.globalAlpha = 1 - aftermath;

  if (stopped || aftermath > 0) {
    ctx.strokeStyle = '#ffe5a1';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 34);
    ctx.lineTo(W*.36, 34); ctx.lineTo(W*.39, 48); ctx.lineTo(W*.41, 30); ctx.lineTo(W*.48, 34);
    ctx.moveTo(W*.53, 34); ctx.lineTo(W, 34);
    ctx.moveTo(0, H-34); ctx.lineTo(W*.57, H-34);
    ctx.moveTo(W*.61, H-34); ctx.lineTo(W*.66, H-48); ctx.lineTo(W*.69, H-31); ctx.lineTo(W, H-34);
    ctx.stroke();
    if (aftermath > 0 && motion) {
      ctx.lineWidth = 4 * (1 - aftermath);
      circle(cut.x, cut.y, R + aftermath * 280); ctx.stroke();
    }
  }

  if (cut.age < GRID_RELEASE) {
    const countdown = Math.max(0, cut.age - GRID_BUILDUP) / TIME_STOP;
    const windup = stopped && motion ? countdown : 0;
    ctx.shadowBlur = 18;
    ctx.shadowColor = '#ffbe57';
    ctx.strokeStyle = '#ffd881';
    ctx.lineWidth = 5;
    circle(cut.x, cut.y, R + 8); ctx.stroke();
    if (stopped && motion) {
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cut.x, cut.y, cut.reach, cut.angle - 1.45, cut.angle - 1.44 + windup * 1.45);
      ctx.stroke();
      const weaponAngle = cut.angle - (1 - windup) * 1.45;
      const dx = Math.cos(weaponAngle), dy = Math.sin(weaponAngle);
      ctx.strokeStyle = '#fff3d6';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(cut.x + dx * R, cut.y + dy * R);
      ctx.lineTo(cut.x + dx * cut.reach, cut.y + dy * cut.reach);
      ctx.stroke();
    }
  }
}

function frame(now) {
  const realDt = previous === undefined ? 0 : Math.max(0, (now - previous) / 1000);
  const dt = Math.min(.05, realDt);
  previous = now;
  if(mode==='ready') previewTime+=dt;
  if(mode==='done'){
    const victoryDt=dt*Number(el('speed').value);
    victoryTime+=victoryDt;
    if(matchWinner) move(matchWinner,victoryDt,wallInset());
    animateHitParticles(victoryDt);
  }
  const wasHolding = holdingGrid();
  if (timeStop && mode !== 'paused') {
    timeStop.age += realDt;
    if (timeStop.age >= GRID_RELEASE + GRID_AFTERMATH) timeStop = null;
  }
  if(mode==='live' && !wasHolding){
    accumulator+=dt*Number(el('speed').value);
    while(accumulator>=1/120&&mode==='live'&&!holdingGrid()){
      if(hitPause>0) hitPause=Math.max(0,hitPause-1/120);
      else step(1/120);
      accumulator-=1/120;
    }
    if (holdingGrid()) accumulator = 0;
    updateHud();
  }
  draw();
  if (timeStop) {
    ctx.save();
    drawGridCut(timeStop);
    ctx.restore();
  }
  gameAudio.tick();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { previous = undefined; });
matchSettings.forEach(select=>select.addEventListener('change',()=>reset()));
el('healthSetting').onsubmit=event=>{
  event.preventDefault();
  if(mode==='live'||mode==='paused'||!el('startingHp').reportValidity()) return;
  startingHp=el('startingHp').valueAsNumber;
  reset();
  el('event').textContent=`Starting health set to ${startingHp} HP for all fighters.`;
};
el('blood').onchange=()=>{bloodDrops=[];};
function updateAudioSettings() {
  gameAudio.configure(el('musicOn').checked,el('effectsOn').checked);
}
el('musicOn').onchange=updateAudioSettings;
el('effectsOn').onchange=updateAudioSettings;
el('start').onclick=()=>el('playGate').showModal();
function startArenaBattle() {
  const arena=el('arena');
  if(arena.selectedIndex===completedArena){
    arena.selectedIndex=(completedArena+1)%arena.options.length;
  }
  completedArena=null;
  updateAudioSettings();
  gameAudio.unlock();
  W=H=ARENA_SIZE;
  const pixels=el('renderQuality').value==='4k'?ARENA_4K_PIXELS:ARENA_SIZE;
  el('field').width=pixels;
  el('field').height=pixels;
  document.body.classList.toggle('recording-frame',el('recordFrame').checked);
  reset(true);
  el('arenaPause').focus({preventScroll:true});
}

function returnToSettings() {
  document.body.classList.remove('arena-only','recording-frame');
  W=el('field').width=PREVIEW_WIDTH;
  H=el('field').height=PREVIEW_HEIGHT;
  reset();
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  el('start').focus();
}

el('play').onclick=()=>{
  el('playGate').close();
  document.body.classList.add('arena-only');
  startArenaBattle();
  const fullscreen=document.documentElement.requestFullscreen?.();
  fullscreen?.catch(()=>{});
};
el('arenaPause').onclick=()=>{
  if(mode!=='live'&&mode!=='paused') return;
  mode=mode==='live'?'paused':'live';
  updateControls();
};
el('arenaExit').onclick=returnToSettings;
el('arenaContinue').onclick=startArenaBattle;
el('arenaSettings').onclick=returnToSettings;
el('reset').onclick=()=>reset();
el('pause').onclick=()=>{mode=mode==='live'?'paused':'live';updateControls();};
reset();
requestAnimationFrame(frame);
</script>
</html>
